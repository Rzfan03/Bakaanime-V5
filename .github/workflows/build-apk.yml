name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Version bumps automatically per build: 1.0.1, 1.0.2, ... (patch = run number).
      - name: Set version from build number
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web (Vite)
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://bakaanime-v5.vercel.app/api' }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)"
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Capacitor sync
        run: npx cap sync android

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          test -s android/app/release.keystore

      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: bakaanime-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Rolling release: a single "latest" release whose asset is overwritten
      # every build so /download.html keeps a permanent download URL.
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          VER="1.0.${{ github.run_number }}"
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$BEFORE..$GITHUB_SHA"
          else
            RANGE="HEAD~1..HEAD"
          fi
          # Changelog shown in the update dialog: one bullet per commit, no type prefix.
          NOTES="$(git log --pretty=format:'%s' --no-merges "$RANGE" 2>/dev/null \
            | sed -E 's/^[a-z]+(\([^)]*\))?!?: //' | sed 's/^/- /')"
          [ -n "$NOTES" ] || NOTES="- Perbaikan dan peningkatan"
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest --title "APK v$VER" --notes "$NOTES"
          gh release upload latest "$APK" --clobber
          gh release edit latest --title "APK v$VER" --notes "$NOTES"

      # Append a feed entry so bakaanime.atom keeps the full history (newest
      # first). Commit back with [skip ci] so this doesn't build another APK.
      - name: Update atom feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          if [ "$BRANCH" = "$GITHUB_REF" ]; then BRANCH=""; fi
          # Only branches that can be pushed back; tag/dispatch runs skip.
          [ -n "$BRANCH" ] || { echo "atom: no branch, skip"; exit 0; }
          VER="1.0.${{ github.run_number }}"
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$BEFORE..$GITHUB_SHA"
          else
            RANGE="HEAD~1..HEAD"
          fi
          NOTES="$(git log --pretty=format:'%s' --no-merges "$RANGE" 2>/dev/null \
            | sed -E 's/^[a-z]+(\([^)]*\))?!?: //' | sed 's/^/- /')"
          [ -n "$NOTES" ] || NOTES="- Perbaikan dan peningkatan"
          DATE="$(git log -1 --format=%cI "$GITHUB_SHA")"
          node .github/scripts/update-atom.mjs public/bakaanime.atom "$VER" "$NOTES" "$DATE"
          git diff --quiet -- public/bakaanime.atom && { echo "atom: no change"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/bakaanime.atom
          git commit -m "chore: update bakaanime.atom [skip ci]"
          git push origin "$BRANCH"