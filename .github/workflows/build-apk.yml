name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web (Vite)
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://bakaanime-v5.vercel.app/api' }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)"
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Capacitor sync
        run: npx cap sync android

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          test -s android/app/release.keystore

      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: bakaanime-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Rilis bergulir: satu release "latest" yang asetnya selalu ditimpa, biar
      # halaman /download.html punya URL unduh tetap.
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          NOTES="Commit ${GITHUB_SHA::7} · $(date -u +%Y-%m-%dT%H:%MZ)"
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest --title "APK terbaru" --notes "$NOTES"
          gh release upload latest "$APK" --clobber
          gh release edit latest --notes "$NOTES"